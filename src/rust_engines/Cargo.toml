[package]
name = "sovereign-engines"
version = "0.1.0"
edition = "2021"
authors = ["Alfredo Medina Hernandez"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
